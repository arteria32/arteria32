<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .bg { fill:#f6f4ef; }
      .title { fill:#1f1f1f; font-family: Inter, Arial, sans-serif; font-size:34px; font-weight:600; }
      .note { fill:#4a4a4a; font-family: Inter, Arial, sans-serif; font-size:16px; }
      .panel { fill:#fffdf8; stroke:#bfb8aa; stroke-width:3; }
      .line { stroke:#c7c1b5; stroke-width:3; stroke-dasharray:8 10; }
      .vase { fill:#ded8cd; stroke:#a8a196; stroke-width:1.6; }
      .stem { stroke:#2f2f2f; stroke-width:2.4; stroke-linecap:round; }
      .calla { fill:#f7f3ea; stroke:#bfb8aa; stroke-width:1.2; }
      .candle { fill:#e8e1d4; stroke:#bfb8aa; stroke-width:1.2; }
      .steel { fill:#c8c8c8; }
      .label { fill:#2a2a2a; font-family: Inter, Arial, sans-serif; font-size:18px; font-weight:600; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1400" height="900" class="bg"/>

  <text x="60" y="88" class="title">Milk Gallery - table detail (decor rhythm)</text>
  <text x="60" y="124" class="note">One flower type (calla). Identical bud vases and candle holders. Keep everything low for conversation.</text>

  <!-- Table surface -->
  <rect x="80" y="190" width="1240" height="560" rx="16" class="panel" filter="url(#shadow)"/>
  <text x="620" y="180" class="label">Tablecloth: ivory linen (clean, generous drop)</text>

  <!-- Centerline -->
  <line x1="130" y1="470" x2="1270" y2="470" class="line"/>

  <!-- Bud vases -->
  <g>
    <g class="vase">
      <rect x="150" y="440" width="24" height="70" rx="8"/>
      <rect x="230" y="440" width="24" height="70" rx="8"/>
      <rect x="310" y="440" width="24" height="70" rx="8"/>
      <rect x="390" y="440" width="24" height="70" rx="8"/>
      <rect x="470" y="440" width="24" height="70" rx="8"/>
      <rect x="550" y="440" width="24" height="70" rx="8"/>
      <rect x="630" y="440" width="24" height="70" rx="8"/>
      <rect x="710" y="440" width="24" height="70" rx="8"/>
      <rect x="790" y="440" width="24" height="70" rx="8"/>
      <rect x="870" y="440" width="24" height="70" rx="8"/>
      <rect x="950" y="440" width="24" height="70" rx="8"/>
      <rect x="1030" y="440" width="24" height="70" rx="8"/>
      <rect x="1110" y="440" width="24" height="70" rx="8"/>
      <rect x="1190" y="440" width="24" height="70" rx="8"/>
    </g>

    <!-- Stems -->
    <g class="stem">
      <line x1="162" y1="438" x2="162" y2="390"/>
      <line x1="242" y1="438" x2="242" y2="384"/>
      <line x1="322" y1="438" x2="322" y2="392"/>
      <line x1="402" y1="438" x2="402" y2="382"/>
      <line x1="482" y1="438" x2="482" y2="392"/>
      <line x1="562" y1="438" x2="562" y2="386"/>
      <line x1="642" y1="438" x2="642" y2="391"/>
      <line x1="722" y1="438" x2="722" y2="384"/>
      <line x1="802" y1="438" x2="802" y2="392"/>
      <line x1="882" y1="438" x2="882" y2="385"/>
      <line x1="962" y1="438" x2="962" y2="391"/>
      <line x1="1042" y1="438" x2="1042" y2="384"/>
      <line x1="1122" y1="438" x2="1122" y2="392"/>
      <line x1="1202" y1="438" x2="1202" y2="385"/>
    </g>

    <!-- Calla heads -->
    <g class="calla">
      <ellipse cx="162" cy="378" rx="13" ry="9"/>
      <ellipse cx="242" cy="372" rx="13" ry="9"/>
      <ellipse cx="322" cy="380" rx="13" ry="9"/>
      <ellipse cx="402" cy="370" rx="13" ry="9"/>
      <ellipse cx="482" cy="380" rx="13" ry="9"/>
      <ellipse cx="562" cy="374" rx="13" ry="9"/>
      <ellipse cx="642" cy="379" rx="13" ry="9"/>
      <ellipse cx="722" cy="372" rx="13" ry="9"/>
      <ellipse cx="802" cy="380" rx="13" ry="9"/>
      <ellipse cx="882" cy="373" rx="13" ry="9"/>
      <ellipse cx="962" cy="379" rx="13" ry="9"/>
      <ellipse cx="1042" cy="372" rx="13" ry="9"/>
      <ellipse cx="1122" cy="380" rx="13" ry="9"/>
      <ellipse cx="1202" cy="373" rx="13" ry="9"/>
    </g>
  </g>

  <!-- Candles between vases -->
  <g class="candle">
    <circle cx="196" cy="470" r="7"/>
    <circle cx="276" cy="470" r="7"/>
    <circle cx="356" cy="470" r="7"/>
    <circle cx="436" cy="470" r="7"/>
    <circle cx="516" cy="470" r="7"/>
    <circle cx="596" cy="470" r="7"/>
    <circle cx="676" cy="470" r="7"/>
    <circle cx="756" cy="470" r="7"/>
    <circle cx="836" cy="470" r="7"/>
    <circle cx="916" cy="470" r="7"/>
    <circle cx="996" cy="470" r="7"/>
    <circle cx="1076" cy="470" r="7"/>
    <circle cx="1156" cy="470" r="7"/>
    <circle cx="1236" cy="470" r="7"/>
  </g>

  <!-- Place card example -->
  <rect x="120" y="610" width="210" height="70" rx="10" fill="#fffdf8" stroke="#bfb8aa" stroke-width="2"/>
  <text x="145" y="648" font-family="Inter, Arial, sans-serif" font-size="18" fill="#1f1f1f">NAME SURNAME</text>
  <text x="145" y="672" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5a5a5a">minimal typography</text>

  <!-- Material chips -->
  <text x="980" y="636" class="label">Materials</text>
  <circle cx="990" cy="670" r="10" class="steel"/>
  <text x="1010" y="676" class="note">matte steel (candle holders)</text>
  <circle cx="990" cy="705" r="10" fill="#fffdf8" stroke="#bfb8aa" stroke-width="1.2"/>
  <text x="1010" y="711" class="note">cotton paper / linen</text>
  <circle cx="990" cy="740" r="10" fill="#ded8cd" stroke="#a8a196" stroke-width="1.2"/>
  <text x="1010" y="746" class="note">glass (clear/smoked)</text>
</svg>
